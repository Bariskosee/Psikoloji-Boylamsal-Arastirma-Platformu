# Render deployment — PRODUCTION (ADR-010). Single EU region: Frankfurt.
#
# ─────────────────────────────────────────────────────────────────────────────
# The staging counterpart is `render.staging.yaml`. The two are kept structurally
# identical by `infrastructure/blueprints.test.ts`, which fails if a service or
# an environment variable is added to one and not the other — the way a staging
# environment normally stops being a mirror.
#
# CRITICAL: the `worker` service must be always-on. On a plan that spins
# services down when idle, the reconciliation sweepers stop and the entire
# scheduling correctness guarantee silently disappears (ADR-005). Nothing
# reports it; sessions simply stop opening.
#
# BEFORE THE FIRST DEPLOY, read `docs/runbooks/first-deploy.md`. Two things
# must be done by hand and neither is guessable from an error message:
#   1. the two NOLOGIN group roles that enforce NFR-03 must exist, and the
#      database user must be a member of them;
#   2. `NEXT_PUBLIC_API_URL` is inlined into the frontends AT BUILD TIME —
#      changing it later requires a rebuild, not a restart.
# ─────────────────────────────────────────────────────────────────────────────

databases:
  - name: lpr-postgres
    databaseName: lpr
    user: lpr
    region: frankfurt
    # Must support point-in-time recovery (NFR-18). Raise before the pilot:
    # NFR-11 sizes a study at 500 participants and ~500 responses each.
    plan: basic-1gb

services:
  - type: web
    name: lpr-api
    runtime: node
    region: frankfurt
    plan: starter # NOT free — free spins down
    buildCommand: pnpm install --frozen-lockfile && pnpm build --filter=@lpr/api...
    startCommand: pnpm --filter=@lpr/api start
    # Migrations run before the new version serves traffic, and are always
    # backward-compatible with the previous release so rollback is safe.
    #
    # `migrate:deploy`, not `migrate:up`: the latter is the drizzle-kit CLI,
    # which is a devDependency and is absent once dev dependencies are pruned.
    # `migrate:deploy` runs `packages/db/dist/migrate.js`, which uses
    # drizzle-orm's own migrator — a production dependency.
    preDeployCommand: pnpm --filter=@lpr/db migrate:deploy
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is assigned by Render and read by the application; API_PORT is only
      # the local default. Do not set either here.
      - key: DATABASE_URL
        fromDatabase: { name: lpr-postgres, property: connectionString }
      - key: SESSION_SECRET
        generateValue: true
      - key: PARTICIPANT_ORIGIN
        sync: false
      - key: RESEARCHER_ORIGIN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: LOG_LEVEL
        value: info
      # ── Web Push ───────────────────────────────────────────────────────────
      # Long-lived credentials that must survive redeployment. Rotating them
      # deactivates every existing subscriber permanently and cannot be repaired
      # server-side (docs/runbooks/push-failure-triage.md §2). Treat them as
      # study data, not as configuration, and keep a copy outside Render.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # ── Outbound email ─────────────────────────────────────────────────────
      # Researcher password resets only; nothing is ever emailed to
      # participants. Leaving SMTP_HOST empty is supported — the link is written
      # to the log and startup warns — but in production it means no researcher
      # can recover their own account without an operator reading logs.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SECURE
        value: "false"
      - key: MAIL_FROM
        sync: false

  - type: worker
    name: lpr-worker
    runtime: node
    region: frankfurt
    plan: starter # MUST be always-on — see the warning above
    buildCommand: pnpm install --frozen-lockfile && pnpm build --filter=@lpr/worker...
    startCommand: pnpm --filter=@lpr/worker start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: lpr-postgres, property: connectionString }
      - key: SWEEP_INTERVAL_SECONDS
        value: "60"
      - key: SENTRY_DSN
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

  - type: web
    name: lpr-participant
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm build --filter=@lpr/participant...
    startCommand: pnpm --filter=@lpr/participant start
    envVars:
      - key: NODE_ENV
        value: production
      # Inlined into the bundle at BUILD time. Changing it needs a rebuild.
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: web
    name: lpr-researcher
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm build --filter=@lpr/researcher...
    startCommand: pnpm --filter=@lpr/researcher start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
