packages:
  - "apps/*"
  - "packages/*"

# pnpm blocks postinstall scripts by default. Only these are permitted, and each
# genuinely needs one: esbuild fetches its platform binary (used by Vitest),
# sharp fetches native image bindings (used by Next.js image optimisation).
# Anything not listed here cannot execute code at install time.
#
# @swc/core is explicitly DENIED rather than merely unlisted. Vitest needs SWC
# to emit the decorator metadata NestJS DI depends on — esbuild cannot emit it
# at all — but SWC ships its native binding as a platform-specific optional
# dependency and runs correctly without its install script. Recording the "no"
# keeps `pnpm install` clean without granting code execution at install time.
allowBuilds:
  esbuild: true
  sharp: true
  "@swc/core": false

# Refuse to install on an unsupported Node version rather than only warning.
# pnpm 11 reads these settings here, not from .npmrc.
engineStrict: true

# Patched versions forced onto transitive dependencies (Phase 12 security pass).
#
# All three reach us only through Next.js and the test tooling, and none is
# reachable in this codebase — we render no CSS files for postcss to process,
# never call next/image so sharp is never invoked, and expose no Vite dev
# server. They are pinned anyway: "not reachable" is a property of today's code,
# and a future page that imports a stylesheet should not silently re-open a
# path-traversal advisory.
overrides:
  postcss: ">=8.5.23"
  sharp: ">=0.35.0"
  vite: ">=6.4.3"
